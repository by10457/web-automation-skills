# Merge this section into the current user's Codex config.toml.
# Placeholder paths only. Prefer node setup.js to generate actual local paths.
[mcp_servers.bitbrowser]
command = "/absolute/path/to/node"
args = ["/absolute/path/to/bitbrowser/adapters/mcp/stdio.js"]
startup_timeout_sec = 20
tool_timeout_sec = 180

[mcp_servers.bitbrowser.env]
BITBROWSER_API_URL = "http://127.0.0.1:54345"
BITBROWSER_COORDINATION_DIR = "/absolute/path/to/shared-bitbrowser-coordination"
BITBROWSER_STATE_DIR = "/absolute/path/to/bitbrowser-state"
